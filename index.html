<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Battle Items v9.6</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box} body{margin:0;background:#080a0f;color:#fff}
.app{max-width:760px;margin:auto;padding:20px 16px 100px}
h1{font-size:27px;margin:8px 0 3px}.sub,.muted{color:#99a3b4}
.panel,.person{background:#141824;border:1px solid #2b3242;border-radius:22px;padding:16px;margin:14px 0}
input{width:100%;padding:15px;border-radius:15px;border:1px solid #343c4e;background:#0c0f16;color:#fff;font-size:17px;margin:7px 0 12px}
button{border:0;border-radius:15px;padding:14px 16px;font-size:16px;font-weight:800}
.primary{width:100%;background:#65d9c4;color:#07100e}.add{background:#65d9c4;color:#07100e}
.secondary{background:#252b38;color:#fff}.danger{background:#3a2026;color:#ffb7c1}
.personHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.personToggle{display:flex;align-items:center;gap:9px;min-width:0;flex:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chev{font-size:16px;color:#65d9c4;transition:transform .18s ease}
.person.collapsed .chev{transform:rotate(-90deg)}
.badge{font-size:12px;font-weight:800;color:#aeb8c8;background:#242b38;border-radius:999px;padding:5px 8px;white-space:nowrap}
.personBody{display:block}
.person.collapsed .personBody{display:none}
.personName{font-size:22px;font-weight:900}.items{display:grid;gap:10px;margin-top:13px}
.item{background:#0d1119;border:1px solid #2b3242;border-radius:17px;padding:13px}
.itemTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.itemName{font-size:18px;font-weight:850}.days{font-weight:900}.warn{color:#ffd36a}.expired{color:#ff7c8d}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.controls button{padding:10px 13px}
.empty{text-align:center;color:#8f99aa;padding:34px 0}
dialog{border:1px solid #343c4e;border-radius:22px;background:#141824;color:#fff;width:min(92vw,520px);padding:18px}
dialog::backdrop{background:#000a}.row{display:grid;grid-template-columns:1fr 110px;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:#141824;border:1px solid #2b3242;border-radius:18px;padding:14px;text-align:center}.stat b{font-size:25px;display:block}
.note{font-size:12px;color:#8f99aa;margin-top:8px}
.urgentBadge{font-size:12px;font-weight:900;border-radius:999px;padding:5px 8px;white-space:nowrap}
.urgentSoon{background:#3a3016;color:#ffd36a}
.urgentCritical{background:#3a2026;color:#ff9cab}
.urgentExpired{background:#491c25;color:#ff7c8d}
@media(max-width:480px){.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:11px 5px}.stat b{font-size:21px}.stat{font-size:12px}.badge{display:none}}
</style>
</head>
<body><main class="app">
<h1>⚔️ Battle Items <span style="font-size:15px;color:#65d9c4">v9.6</span></h1>
<div class="sub">リスナーごとに複数アイテムをまとめて管理</div>
<div class="stats">
<div class="stat"><b id="peopleCount">0</b>リスナー</div>
<div class="stat"><b id="boxingCount">0</b>🥊</div>
<div class="stat"><b id="secondCount">0</b>2位</div>
<div class="stat"><b id="thirdCount">0</b>3位</div>
</div>

<section class="panel">
<label>新しいリスナー</label>
<input id="newPerson" placeholder="例：たろう">
<button class="primary" id="addPerson">＋ リスナーを登録</button>
<div class="note">登録後、その人のカードから複数アイテムを追加できます。</div>
</section>

<section id="list"></section>
</main>

<dialog id="itemDialog">
<form method="dialog" id="itemForm">
<h2 id="dialogTitle">アイテム追加</h2>
<input type="hidden" id="personId">
<label>アイテム名</label>
<input id="itemName" required placeholder="例：グローブ">
<div class="row">
<div><label>所持数</label><input id="qty" type="number" min="1" value="1" required></div>
<div><label>残り日数</label><input id="days" type="number" min="0" value="5" required></div>
</div>
<div class="note">「グローブ」は自動で5日スタートになります。</div>
<div class="controls">
<button type="button" class="add" id="saveItem">追加する</button>
<button type="button" class="secondary" id="cancelDialog">キャンセル</button>
</div>
</form>
</dialog>

<script>
const KEY='battle-items-v9-people';
const OLD_KEY='battle-items-v8-people';
let people=[];
const collapsed=new Set();
const $=id=>document.getElementById(id);
function safeLoad(){try{
 let raw=localStorage.getItem(KEY);
 if(!raw){
   const old=JSON.parse(localStorage.getItem(OLD_KEY)||'[]');
   if(Array.isArray(old)&&old.length){
     const now=Date.now();
     old.forEach(p=>(p.items||[]).forEach(i=>{
       const oldStart=i.startDate||now;
       const elapsedDays=Math.max(0,Math.floor((new Date().setHours(0,0,0,0)-oldStart)/86400000));
       const left=Math.max(0,(i.startDays||5)-elapsedDays);
       i.startDate=now;i.expiresAt=now+left*86400000;
     }));
     people=old;safeSave();return;
   }
 }
 const x=JSON.parse(raw||'[]');if(Array.isArray(x))people=x
}catch(e){}}
function safeSave(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}}
function remainingMs(it){
 const expiresAt=it.expiresAt ?? ((it.startDate||Date.now())+(it.startDays||5)*86400000);
 return expiresAt-Date.now();
}
function remainingInfo(ms){
 if(ms<=0)return {text:'期限切れ',cls:'expired'};
 const mins=Math.ceil(ms/60000);
 if(mins<60)return {text:`残り${mins}分`,cls:'warn'};
 const hours=Math.ceil(ms/3600000);
 if(ms<86400000)return {text:`残り${hours}時間`,cls:'warn'};
 const days=Math.ceil(ms/86400000);
 return {text:`残り${days}日`,cls:days<=2?'warn':''};
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nearestUrgency(p){
 const items=(p.items||[])
   .filter(i=>(Number(i.qty)||0)>0)
   .map(i=>({i,ms:remainingMs(i)}))
   .filter(x=>x.ms<=86400000)
   .sort((a,b)=>a.ms-b.ms);
 if(!items.length)return '';
 const {i,ms}=items[0], info=remainingInfo(ms);
 let cls='urgentSoon';
 if(ms<=0)cls='urgentExpired';
 else if(ms<3600000)cls='urgentCritical';
 return `<span class="urgentBadge ${cls}">⚠️ ${esc(i.name)} ${info.text}</span>`;
}
function render(){
 $('peopleCount').textContent=people.length;
 const allItems=people.flatMap(p=>p.items||[]);
 const norm=s=>String(s||'').trim().replace(/\s+/g,'');
 const sumMatch=(fn)=>allItems.filter(i=>fn(norm(i.name))).reduce((a,i)=>a+(Number(i.qty)||0),0);
 $('boxingCount').textContent=sumMatch(n=>n==='🥊'||n==='グローブ'||n==='🥊グローブ'||n==='グローブ🥊');
 $('secondCount').textContent=sumMatch(n=>n==='2位'||n==='２位');
 $('thirdCount').textContent=sumMatch(n=>n==='3位'||n==='３位');
 const list=$('list');
 if(!people.length){list.innerHTML='<div class="empty">まだリスナーが登録されていません</div>';return}
 list.innerHTML=people.map(p=>`<article class="person ${collapsed.has(p.id)?'collapsed':''}" id="person-${p.id}">
 <div class="personHead">
   <div class="personToggle" onclick="togglePerson('${p.id}')">
     <span class="chev">▼</span><div class="personName">👤 ${esc(p.name)}</div>
     ${nearestUrgency(p)}
     <span class="badge">${p.items.length}種類 / ${p.items.reduce((a,i)=>a+i.qty,0)}個</span>
   </div>
   <button class="add" onclick="event.stopPropagation();openAdd('${p.id}')">＋ アイテム</button>
 </div>
 <div class="personBody">
 <div class="items">${p.items.length?p.items.map(i=>{
   const ri=remainingInfo(remainingMs(i));
   return `<div class="item"><div class="itemTop"><div><div class="itemName">${esc(i.name)} ×${i.qty}</div><div class="muted">使用 ${i.used||0}個</div></div><div class="days ${ri.cls}">${ri.text}</div></div>
   <div class="controls"><button class="secondary" onclick="useItem('${p.id}','${i.id}')">使用 −1</button><button class="secondary" onclick="plusItem('${p.id}','${i.id}')">＋1</button><button class="danger" onclick="deleteItem('${p.id}','${i.id}')">削除</button></div></div>`
 }).join(''):'<div class="muted" style="padding:12px 0">アイテムなし</div>'}</div>
 <div class="controls"><button class="danger" onclick="deletePerson('${p.id}')">リスナーを削除</button></div>
 </div>
 </article>`).join('');
}
$('addPerson').onclick=()=>{
 const name=$('newPerson').value.trim(); if(!name){alert('リスナー名を入力してね');return}
 const existing=people.find(p=>p.name===name); if(existing){openAdd(existing.id);$('newPerson').value='';return}
 const p={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,items:[]};
 people.push(p);$('newPerson').value='';safeSave();render();openAdd(p.id);
};
window.togglePerson=id=>{
 if(collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
 const card=document.getElementById('person-'+id);
 if(card) card.classList.toggle('collapsed',collapsed.has(id));
};
window.openAdd=id=>{const p=people.find(x=>x.id===id);if(!p)return;$('personId').value=id;$('dialogTitle').textContent=`${p.name}さんにアイテム追加`;$('itemName').value='';$('qty').value=1;$('days').value=5;$('itemDialog').showModal()}
$('cancelDialog').onclick=()=> $('itemDialog').close();
$('itemName').addEventListener('input',()=>{if($('itemName').value.trim().includes('グローブ'))$('days').value=5});
$('saveItem').onclick=()=>{
 const p=people.find(x=>x.id===$('personId').value); const name=$('itemName').value.trim();
 const qty=Math.max(1,parseInt($('qty').value)||1); if(!p||!name){alert('アイテム名を入力してね');return}
 const startDays=Math.max(0,parseInt($('days').value)||0);
 const now=Date.now();
 p.items.push({id:String(now+Math.random()),name,qty,used:0,startDays,startDate:now,expiresAt:now+startDays*86400000});
 safeSave();render();$('itemDialog').close();
};
window.useItem=(pid,iid)=>{const i=people.find(p=>p.id===pid)?.items.find(x=>x.id===iid);if(!i||i.qty<=0)return;i.qty--;i.used=(i.used||0)+1;safeSave();render()}
window.plusItem=(pid,iid)=>{const i=people.find(p=>p.id===pid)?.items.find(x=>x.id===iid);if(!i)return;i.qty++;safeSave();render()}
window.deleteItem=(pid,iid)=>{const p=people.find(x=>x.id===pid);if(!p)return;if(confirm('このアイテムを削除しますか？')){p.items=p.items.filter(x=>x.id!==iid);safeSave();render()}}
window.deletePerson=pid=>{if(confirm('このリスナーと所持アイテムをすべて削除しますか？')){people=people.filter(p=>p.id!==pid);safeSave();render()}}
safeLoad();render();setInterval(render,30000);
</script></body></html>
