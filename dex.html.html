<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TikTok Battle Item Manager</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff}.app{max-width:760px;margin:auto;padding:18px 14px 100px}h1{font-size:24px;margin:8px 0 4px}.sub{color:#9da7b8;font-size:13px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat,.card,.panel{background:#141822;border:1px solid #242b39;border-radius:18px}.stat{padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:#9da7b8}.panel{padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:11px;color:#9da7b8;display:block;margin:0 0 5px 3px}input,select,button{width:100%;border:0;border-radius:12px;padding:12px;font-size:15px}input,select{background:#0d1017;color:white;border:1px solid #293141}button{font-weight:800;background:#24e1c1;color:#07100e}.filters{display:flex;gap:7px;overflow:auto;margin:12px 0}.filters button{width:auto;white-space:nowrap;padding:9px 12px;background:#171c27;color:#bdc6d5;border:1px solid #293141}.filters button.active{background:#fff;color:#000}.card{padding:14px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:19px;font-weight:900}.item{color:#c6cede;font-size:14px;margin-top:3px}.badge{font-size:12px;font-weight:900;padding:7px 9px;border-radius:999px;background:#253044;white-space:nowrap}.soon{background:#5b4510;color:#ffd85a}.expired{background:#4b1d28;color:#ff879d}.ok{background:#153d35;color:#6af3d6}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}.meta div{background:#0d1017;border-radius:11px;padding:9px;text-align:center}.meta b{display:block;font-size:16px}.meta span{font-size:10px;color:#8994a6}.actions{display:grid;grid-template-columns:1.3fr .7fr .7fr;gap:7px;margin-top:10px}.actions button{padding:10px}.use{background:#ff315f;color:white}.plus{background:#273043;color:white}.del{background:#2a1a20;color:#ff8ca2}.empty{text-align:center;color:#7f899a;padding:40px 10px}.foot{font-size:11px;color:#707b8d;text-align:center;margin-top:18px}@media(max-width:520px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="app"><h1>⚔️ Battle Items <small style="font-size:12px;color:#24e1c1">v7</small></h1><div class="sub">リスナー別・TikTokバトルアイテム管理</div><section class="stats"><div class="stat"><b id="people">0</b><span>リスナー</span></div><div class="stat"><b id="items">0</b><span>総アイテム</span></div><div class="stat"><b id="soon">0</b><span>期限3日以内</span></div></section><section class="panel"><div class="grid"><div><label>リスナー名</label><input id="listener" placeholder="例：たろう"></div><div><label>アイテム名</label><input id="item" placeholder="例：グローブ"></div><div><label>所持数</label><input id="qty" type="number" min="1" value="1"></div><div><label>残り日数</label><input id="days" type="number" min="0" value="5" placeholder="グローブは自動で5日"></div></div><button id="add" style="margin-top:10px">＋ 所持アイテムを登録</button></section><div class="filters"><button class="active" data-f="all">すべて</button><button data-f="soon">期限3日以内</button><button data-f="expired">期限切れ</button><button data-f="stock">所持あり</button></div><div id="storageNotice" style="display:none;margin:10px 0;padding:10px;border-radius:12px;background:#5b4510;color:#ffd85a;font-size:12px">この開き方では端末保存が制限されています。登録・操作はできますが、画面を閉じるとデータが消える場合があります。Safariで開くと保存しやすくなります。</div><div id="list"></div><div class="foot">グローブは登録した当日が「残り5日」｜翌日4日｜残り日数は毎日自動で1日ずつ減ります｜データはこのブラウザ内に保存されます</div></main><script>
const KEY='battle-items-v7-ios-fixed';const OLD_KEYS=['battle-items-v6-glove5-fixed','battle-items-v5-glove5','battle-items-v4-days','battle-items-v2'];let storageOK=true;function getStore(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return null}}function setStore(k,v){try{localStorage.setItem(k,v);storageOK=true;return true}catch(e){storageOK=false;return false}}function safeParse(v){try{return v?JSON.parse(v):null}catch(e){return null}}let data=safeParse(getStore(KEY));if(!data){for(const k of OLD_KEYS){const old=safeParse(getStore(k));if(old){data=old;break}}}data=Array.isArray(data)?data:[];data=data.map(x=>{if(x.expiry&&!x.createdAt){const today=new Date();today.setHours(0,0,0,0);const e=new Date(x.expiry+'T00:00:00');x.initialDays=Math.max(0,Math.ceil((e-today)/86400000));x.createdAt=today.toISOString()}return x});let filter='all';const $=id=>document.getElementById(id);function save(){setStore(KEY,JSON.stringify(data));render();showStorageNotice()}function localDayNumber(d=new Date()){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}function daysLeft(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);const end=Math.floor(Date.UTC(y,m-1,d)/86400000);return end-localDayNumber()}function expiryFromDays(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+Math.max(0,Number(n)||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function label(d){if(d===null)return['期限未設定','badge'];if(d<0)return['期限切れ','badge expired'];if(d===0)return['本日期限','badge soon'];if(d<=3)return['残り'+d+'日','badge soon'];return['残り'+d+'日','badge ok']}function showStorageNotice(){const n=$('storageNotice');if(n)n.style.display=storageOK?'none':'block'}function render(){let arr=data.map((x,i)=>({...x,i,d:daysLeft(x.expiry)}));if(filter==='soon')arr=arr.filter(x=>x.d!==null&&x.d>=0&&x.d<=3);if(filter==='expired')arr=arr.filter(x=>x.d!==null&&x.d<0);if(filter==='stock')arr=arr.filter(x=>x.qty>0);$('people').textContent=new Set(data.map(x=>x.listener)).size;$('items').textContent=data.reduce((a,x)=>a+Number(x.qty),0);$('soon').textContent=data.filter(x=>{let d=daysLeft(x.expiry);return d!==null&&d>=0&&d<=3}).length;$('list').innerHTML=arr.length?arr.map(x=>{let [txt,cl]=label(x.d);return `<article class="card"><div class="top"><div><div class="name">${esc(x.listener)}</div><div class="item">🎁 ${esc(x.item)}</div></div><div class="${cl}">${txt}</div></div><div class="meta"><div><b>${x.qty}</b><span>残り個数</span></div><div><b>${x.used||0}</b><span>使用済み</span></div><div><b>${x.d===null?'—':x.d<0?'期限切れ':x.d+'日'}</b><span>残り日数</span></div></div><div class="actions"><button class="use" onclick="use(${x.i})">使用 −1</button><button class="plus" onclick="plus(${x.i})">＋1</button><button class="del" onclick="del(${x.i})">削除</button></div></article>`}).join(''):'<div class="empty">該当するアイテムはありません</div>'}function use(i){if(data[i].qty>0){data[i].qty--;data[i].used=(data[i].used||0)+1;save()}}function plus(i){data[i].qty++;save()}function del(i){if(confirm('この登録を削除しますか？')){data.splice(i,1);save()}}$('add').onclick=()=>{let listener=$('listener').value.trim(),item=$('item').value.trim(),qty=Math.max(1,Number($('qty').value)||1);let isGlove=item.replace(/\s/g,'').includes('グローブ');let days=isGlove?5:Math.max(0,Number($('days').value)||0),expiry=expiryFromDays(days);if(!listener||!item)return alert('リスナー名とアイテム名を入力してください');data.unshift({listener,item,qty,expiry,initialDays:days,createdAt:new Date().toISOString(),used:0});$('listener').value='';$('item').value='';$('qty').value=1;$('days').value=5;save()};document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});$('item').addEventListener('input',()=>{if($('item').value.replace(/\s/g,'').includes('グローブ')){$('days').value=5;$('days').disabled=true}else{$('days').disabled=false}});showStorageNotice();render();</script></body></html>
